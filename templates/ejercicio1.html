<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/static/style.css">
    <title>Formulario de Notas</title>
</head>
<body>
    <div class="container1">
        <h1>Formulario de Notas</h1>
        <form action="/ejercicio1" method="POST">
            <div class="form-group1">
                <h3>Nota 1:</h3>
                <label for="nota1"></label>
                <input type="text" name="nota1" id="nota1" min="10" max="70"><br>
            </div>
            <div class="form-group1">
                <h3>Nota 2:</h3>
                <label for="nota2"></label>
                <input type="text" name="nota2" id="nota2" min="10" max="70"><br>
            </div>
            <div class="form-group1">
                <h3>Nota 3:</h3>
                <label for="nota3"></label>
                <input type="text" name="nota3" id="nota3" min="10" max="70"><br>
            </div>
            <div class="form-group1">
                <h3>Asistencia (%):</h3>
                <label for="asistencia"></label>
                <input type="text" name="asistencia" id="asistencia" min="0" max="100"><br>
            </div>
            <div class="form-group1">
                <input type="submit" value="Enviar">
            </div>
        </form>
        {% if promedio and resultado %}
        <div>
            <p>El promedio de las notas es de {{ promedio }}</p>
            <p>Evaluación final: {{ resultado }}</p>
        </div>
        {% endif %}
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
